apiVersion: v1
kind: ServiceAccount
metadata:
  name: portfolio-deployer
  namespace: arc-runners
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: portfolio-deployer
  namespace: portfolio
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: [get, list, watch, update, patch]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: portfolio-deployer
  namespace: portfolio
subjects:
  - kind: ServiceAccount
    name: portfolio-deployer
    namespace: arc-runners
roleRef:
  kind: Role
  name: portfolio-deployer
  apiGroup: rbac.authorization.k8s.io
